stages:
  - restore
  - audit
  - build
  - test
  - package
  - deploy

default:
  tags:
    - windows # Crucial for .NET Framework 4.8 targeting

variables:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  
  # Tells GitLab to fetch all tags and history so MinVer works.
  GIT_DEPTH: "0"

restore_solution:
  stage: restore
  script:
    - dotnet restore ChronoStack.sln

audit_packages:
  stage: audit
  script:
    - dotnet list ChronoStack.sln package --vulnerable --include-transitive

build_solution:
  stage: build
  script:
    - dotnet restore ChronoStack.sln
    - dotnet build ChronoStack.sln --configuration Release --no-restore

run_tests:
  stage: test
  script:
    - dotnet restore ChronoStack.sln
    - dotnet test ChronoStack.sln --configuration Release --no-restore

pack_library:
  stage: package
  script:
    # MinVer automatically detects the tag and names the package perfectly
    - dotnet restore ChronoStack.sln
    - dotnet build ChronoStack.sln --configuration Release --no-restore
    - dotnet pack src/ChronoStack/ChronoStack.csproj --configuration Release --no-build

publish_nuget:
  stage: deploy
  only:
    - tags # Only run the publish step when a Git Tag (e.g., v1.0.0) is pushed
  script:
    - dotnet restore ChronoStack.sln
    - dotnet build ChronoStack.sln --configuration Release --no-restore
    - dotnet pack src/ChronoStack/ChronoStack.csproj --configuration Release --no-build
    
    # GitLab automatically provides these authentication variables
    - dotnet nuget add source "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/nuget/index.json" -n GitLab -u gitlab-ci-token -p $env:CI_JOB_TOKEN --store-password-in-clear-text
    
    - dotnet nuget push "src\ChronoStack\bin\Release\*.nupkg" --source GitLab --skip-duplicate
