name: ChronoStack CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*' # Triggers only when you push a tag like v1.0.0 or v1.1.2
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Crucial for MinVer to see the tags!

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Restore Dependencies
      run: dotnet restore ChronoStack.sln

    - name: Audit NuGet Packages
      run: dotnet list ChronoStack.sln package --vulnerable --include-transitive

    - name: Build Solution
      run: dotnet build ChronoStack.sln --configuration Release --no-restore

    - name: Run xUnit Tests
      run: dotnet test ChronoStack.sln --configuration Release --no-restore

    - name: Create NuGet Package
      # MinVer will automatically intercept this and name it ChronoStack.1.0.0.nupkg!
      run: dotnet pack src/ChronoStack/ChronoStack.csproj --configuration Release --no-build

    - name: Verify NuGet Package
      run: pwsh -File ./scripts/Verify-ChronoStackPackage.ps1

    - name: Publish to GitHub Packages
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet nuget push src\ChronoStack\bin\Release\*.nupkg `
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
          --api-key ${{ secrets.GITHUB_TOKEN }} `
          --skip-duplicate
